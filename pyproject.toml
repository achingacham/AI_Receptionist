[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "caddy_data", "caddy_config", "data"]

[tool.ruff.lint]
# Errors and likely bugs only: syntax/import errors (E4/E7/E9), pyflakes (F), bugbear (B).
select = ["E4", "E7", "E9", "F", "B"]
# B008: FastAPI's `Depends(...)` in argument defaults is idiomatic.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
