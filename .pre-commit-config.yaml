repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # Use the project venv when present so app dependencies are importable.
        entry: sh -c 'if [ -x .venv/bin/python ]; then .venv/bin/python -m pytest -q; else python -m pytest -q; fi'
        language: system
        pass_filenames: false
        types: [python]
